name: 'Build Pre-Release - Ubuntu 26.04'

on:
  workflow_dispatch:
    inputs:
      prerelease_version:
        description: 'Pre-release version (e.g., 3.7.4-personal-1)'
        required: false
        default: ''

jobs:
  build-linux:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libgdk-pixbuf-2.0-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm install

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__-personal-fork
          releaseName: 'v__VERSION__ - Personal Fork Pre-Release'
          releaseBody: |
            # 🚀 Rclone UI - Personal Fork (Pre-Release)
            
            **All premium features permanently unlocked!**
            
            This is a pre-release of the personal fork with all license restrictions removed.
            
            ## ✨ Features Unlocked
            - 📄 File previews (images, PDFs, documents, spreadsheets, presentations, videos)
            - ♾️ Unlimited remote configurations (previously: 4 limit)
            - ♾️ Unlimited notification targets (previously: 4 limit)
            - 📋 Multi-source copy/move operations
            - ⏱️ Advanced scheduling
            - 🎛️ Full configuration access
            - 🌐 Complete offline operation
            
            ## 📦 Available Downloads
            
            ### For Ubuntu 26.04 / Debian
            - **rclone-ui_*.deb** - Install with: `sudo apt install ./rclone-ui_*.deb`
            
            ### Universal Linux
            - **rclone-ui_*.AppImage** - Download and run: `chmod +x rclone-ui_*.AppImage && ./rclone-ui_*.AppImage`
            
            ## 🏃 Quick Start
            
            ### Using deb package:
            ```bash
            sudo apt install ./rclone-ui_*.deb
            rclone-ui
            ```
            
            ### Using AppImage:
            ```bash
            chmod +x rclone-ui_*.AppImage
            ./rclone-ui_*.AppImage
            ```
            
            ## 📋 Testing Checklist
            
            After launching, verify these features work without license prompts:
            - [ ] Open an image or PDF - no "Unlock Pro" overlay
            - [ ] Add 5+ remote configurations - no limit warning
            - [ ] Create 5+ notification targets - no limit warning
            - [ ] Select and copy multiple files - works without restriction
            - [ ] Create multiple scheduled tasks - unlimited
            - [ ] Check Settings - no "License" tab visible
            - [ ] Works offline - test without internet
            
            ## 📖 Documentation
            
            For detailed information, see the repository:
            - [PERSONAL_FORK_README.md](https://github.com/iHarryPotter178/rclone-ui-fork/blob/iharrypotter178-remove-license-restrictions/PERSONAL_FORK_README.md) - Main documentation
            - [BUILD_UBUNTU.md](https://github.com/iHarryPotter178/rclone-ui-fork/blob/iharrypotter178-remove-license-restrictions/BUILD_UBUNTU.md) - Build instructions
            - [LICENSE_REMOVAL_SUMMARY.md](https://github.com/iHarryPotter178/rclone-ui-fork/blob/iharrypotter178-remove-license-restrictions/LICENSE_REMOVAL_SUMMARY.md) - Technical details
            
            ## ⚠️ Important Notes
            
            - **Personal Use Only** - This fork removes licensing restrictions for personal testing
            - **No License Key Required** - All features available immediately
            - **Offline Capable** - Works completely without internet connection
            - **No Tracking** - No external license validation calls
            
            ## 🔗 Links
            
            - [Fork Repository](https://github.com/iHarryPotter178/rclone-ui-fork)
            - [Feature Branch](https://github.com/iHarryPotter178/rclone-ui-fork/tree/iharrypotter178-remove-license-restrictions)
            - [Pull Request #1](https://github.com/iHarryPotter178/rclone-ui-fork/pull/1)
            - [Original Project](https://github.com/rclone-ui/rclone-ui)
            
            ---
            
            **Built on:** Ubuntu 24.04  
            **Package Format:** deb, AppImage  
            **Status:** Pre-Release (Testing)
          releaseDraft: false
          prerelease: true
          args: ''

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30
